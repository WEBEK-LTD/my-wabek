[build]
  command = "npm run build"
  # Skip the site build when a push only changes the mobile app (mobile/) or CI files.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)mobile' ':(exclude).github'"
  publish = ".next"
  cache = [".next/cache"]

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "true"
  NPM_FLAGS = "--ignore-optional --fetch-retries=5 --fetch-retry-factor=2 --fetch-timeout=120000"

[functions]
  node_bundler = "nft"

# Note: Next.js API routes are bundled by @netlify/plugin-nextjs into a single
# server handler, so per-path [functions."api/..."] blocks do not apply to them.
# Function timeouts for API routes are set in the Netlify UI (Site settings →
# Functions). The scheduler fires campaign batches concurrently and only waits
# ~2.5s on each, so it does not depend on a long timeout.

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
