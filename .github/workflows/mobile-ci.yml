# Checks the mobile app on every pull request / push that touches mobile/.
name: Mobile app — checks

on:
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-*.yml']
  push:
    branches: [main]
    paths: ['mobile/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Languages (English has no Arabic, every key in both)
        run: npm run i18n:check
      - name: Web build (catches bundling errors)
        run: npx expo export --platform web --output-dir /tmp/web
        env:
          EXPO_OFFLINE: '1'
          CI: '1'
