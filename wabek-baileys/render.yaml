services:
  - type: web
    name: wabek-baileys-server
    env: node
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVER_SECRET
        sync: false
      - key: WABEK_EVENTS_URL
        sync: false
      - key: WABEK_EVENTS_SECRET
        sync: false
